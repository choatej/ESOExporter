version: "3"

# Developer tasks. Requires: task, luajit, stylua, luacheck, uv (see CONTRIBUTING.md).

tasks:
  default:
    desc: List the available tasks
    cmds:
      - task --list
    silent: true

  setup:
    desc: Check the development environment (tools/dev-setup.sh; add -- --install to install)
    cmds:
      - tools/dev-setup.sh {{.CLI_ARGS}}

  deploy:
    desc: Copy the add-ons in src/ into the game's AddOns folder (task deploy -- --dry-run to preview)
    cmds:
      - tools/deploy.sh {{.CLI_ARGS}}

  format:
    desc: Format all Lua files
    cmds:
      - stylua .

  format:check:
    desc: Check Lua formatting without changing files
    cmds:
      - stylua --check .

  lint:
    desc: Lint all Lua files
    cmds:
      - luacheck .

  test:
    desc: Run the offline Lua tests (optionally filter by spec name, e.g. task test -- export)
    cmds:
      - luajit tests/lua/run.lua {{.CLI_ARGS}}

  python:format:
    desc: Format the Python project with Black and fix lint with Ruff
    dir: tools/python
    cmds:
      - uv run black .
      - uv run ruff check --fix

  python:check:
    desc: Python format check, lint, type check and tests (needs uv)
    dir: tools/python
    cmds:
      - uv run black --check .
      - uv run ruff check
      - uv run pyrefly check
      - uv run pytest {{.CLI_ARGS}}

  test:python:
    desc: Run the Python tests, including schema validation (needs uv)
    dir: tools/python
    cmds:
      - uv run pytest {{.CLI_ARGS}}

  hygiene:
    desc: Repository hygiene (no personal data, allow-listed fixture names, manifests)
    cmds:
      - python3 tools/python/scripts/check_hygiene.py

  hygiene:prs:
    desc: Compare the plan's pull request rows with GitHub (needs a logged-in gh; not run in CI)
    cmds:
      - python3 tools/python/scripts/check_hygiene.py --prs

  check:
    desc: Everything CI will run later - formatting, lint and tests
    cmds:
      - task: format:check
      - task: lint
      - task: test
      - task: python:check
      - task: hygiene
